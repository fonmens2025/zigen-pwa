/* 自动族文本清理：修正字典原文里残留的未配对引号等痕迹 */
function cleanAutoText(s){
  if(!s) return s;
  var open=(s.match(/“/g)||[]).length, close=(s.match(/”/g)||[]).length;
  while(close>open){ s=s.replace(/”/,''); close--; }
  return s.replace(/\s+/g,' ').trim();
}

/* 多学生档案：存储 key 按当前档案后缀隔离（与 meta.js 保持一致） */
function profileSuffix(){ try{ var p=localStorage.getItem('zigen_current_profile')||''; return p?('_'+p):''; }catch(e){ return ''; } }
function progKey(){ return 'zigen_progress_v1'+profileSuffix(); }
var PROG=loadProg();
var SOUND=true;
function loadProg(){
  try{
    var p=JSON.parse(localStorage.getItem(progKey()));
    if(p && p.stars){
      if(!p.perf) p.perf={};
      if(!p.gradeBest) p.gradeBest={};
      if(!p.starSlots) p.starSlots=['wang','qing'];
      if(p.starSlots.length>2) p.starSlots=p.starSlots.slice(0,2);
      return p;
    }
  }catch(e){}
  return {stars:{},review:null,perf:{},gradeBest:{},starSlots:['wang','qing']};
}
function saveProg(){ try{ localStorage.setItem(progKey(),JSON.stringify(PROG)); }catch(e){} }
function totalStars(){
  var s=0;
  Object.keys(PROG.stars).forEach(function(k){
    PROG.stars[k].forEach(function(x){s+=x;});
  });
  if(PROG.review) s+=PROG.review;
  if(PROG.riddle) s+=PROG.riddle;
  return s;
}
function famStars(id){ return PROG.stars[id]||[0,0,0]; }
function setStars(fam,gi,s){
  if(!PROG.stars[fam]) PROG.stars[fam]=[0,0,0];
  if(s>(PROG.stars[fam][gi]||0)){ PROG.stars[fam][gi]=s; saveProg(); }
}
function titleFor(s){
  if(s>=40) return 4;
  if(s>=30) return 3;
  if(s>=20) return 2;
  if(s>=10) return 1;
  return 0;
}

var app=document.getElementById('app');

function later(fn,ms){ var t=setTimeout(fn,ms); TIMERS.push(t); return t; }
function clearTimers(){ TIMERS.forEach(clearTimeout); TIMERS=[]; stopReading(); }
function shuffle(a){
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}
function $(sel,root){ return (root||document).querySelector(sel); }
function $all(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function speak(t){
  stopReading();
  if(!SOUND) return;
  if(window.META) META.trackListen();
  try{
    if(window.AndroidTTS && window.AndroidTTS.speak){ window.AndroidTTS.speak(String(t)); return; }
    if(!window.speechSynthesis) return;
    var u=new SpeechSynthesisUtterance(t);
    u.lang='zh-CN'; u.rate=0.9; u.pitch=1.0;
    var vs=speechSynthesis.getVoices();
    var pick=null;
    for(var i=0;i<vs.length;i++){
      var v=vs[i];
      if(!v.lang||v.lang.indexOf('zh')!==0) continue;
      if(v.name&&(/Xiaoxiao|Xiaoyi|Yunxi|Yunjian|Yunxia|晓晓|云希/i.test(v.name))){ pick=v; break; }
      if(!pick) pick=v;
    }
    if(pick) u.voice=pick;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
/* 带完成回调的朗读（全文朗读逐句推进用）：Android 走原生 TTS 回调，浏览器走 utterance.onend，
   老版本 APK 无回调时按字数估算兜底 */
var TTS_SEQ={n:0,pending:{}};
var TTS_READING=null;
window.__ttsDone=function(id){
  var cb=TTS_SEQ.pending[id];
  if(cb){ delete TTS_SEQ.pending[id]; try{cb();}catch(e){} }
};
function stopReading(){
  if(TTS_READING){ try{TTS_READING.stop();}catch(e){} TTS_READING=null; }
}
function speakT(t,cb){
  if(!SOUND){ if(cb) later(cb,50); return; }
  if(window.META) META.trackListen();
  try{
    if(window.AndroidTTS && window.AndroidTTS.speak){
      var id='zg'+(++TTS_SEQ.n)+'_'+Math.floor(Math.random()*1e6);
      if(cb) TTS_SEQ.pending[id]=cb;
      window.AndroidTTS.speak(String(t),id);
      if(cb){
        var est=Math.max(1500,String(t).length*280)+5000;
        setTimeout(function(){ if(TTS_SEQ.pending[id]){ delete TTS_SEQ.pending[id]; cb(); } },est);
      }
      return;
    }
    if(!window.speechSynthesis){ if(cb) later(cb,50); return; }
    var u=new SpeechSynthesisUtterance(t);
    u.lang='zh-CN'; u.rate=0.9; u.pitch=1.0;
    if(cb) u.onend=function(){ cb(); };
    speechSynthesis.speak(u);
  }catch(e){ if(cb) later(cb,50); }
}

function confetti(){
  var colors=['#E5A93C','#C94A2C','#4F8A5B','#3E7CB1','#E8A0B4','#9A6B3C'];
  var box=document.createElement('div');
  box.className='confetti-box';
  for(var i=0;i<70;i++){
    var c=document.createElement('div');
    c.className='confetti';
    c.style.left=(Math.random()*100)+'%';
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    c.style.animationDelay=(Math.random()*0.5)+'s';
    c.style.transform='rotate('+(Math.random()*360)+'deg)';
    box.appendChild(c);
  }
  document.body.appendChild(box);
  setTimeout(function(){ if(box.parentNode) box.parentNode.removeChild(box); },4200);
}

var LIB={q:'',tier:'all',shown:24};
function libFams(){
  var starIds=PROG.starSlots||[];
  var retired=FAM.slice(0,4).filter(function(f){ return starIds.indexOf(f.id)<0; });
  var list=FAM.slice(4).filter(function(f){ return starIds.indexOf(f.id)<0; }).concat(retired);
  if(LIB.q){
    var q=LIB.q;
    list=list.filter(function(f){
      if(f.name.indexOf(q)>=0||(f.root||'').indexOf(q)>=0) return true;
      for(var i=0;i<f.members.length;i++){ if(f.members[i].ch.indexOf(q)>=0) return true; }
      return false;
    });
  }
  if(LIB.tier!=='all'){
    list=list.filter(function(f){ return (f.tiers||{})[LIB.tier]>0; });
  }
  return list;
}
function renderLib(reset){

function pickStarCand(exclude){
  var used={};
  (PROG.starSlots||[]).forEach(function(id){ used[id]=1; });
  (exclude||[]).forEach(function(id){ used[id]=1; });
  var cands=FAM.slice(4).filter(function(f){
    return !used[f.id] && f.build&&f.build.length&&f.det&&f.det.length&&f.match&&f.match.length&&f.members.length>=5;
  });
  cands.sort(function(a,b){ return b.members.length-a.members.length; });
  return cands[0]||null;
}
function refreshStarSlots(){
  var slots=PROG.starSlots||['wang','qing'];
  if(slots.length>2) slots=slots.slice(0,2);
  var changed=false, graduated=[];
  var picked=[]; /* 本轮已补位的新族，防止两个字族同时毕业时补进同一族 */
  var newSlots=slots.map(function(id){
    var f=FAMMAP[id];
    if(!f) return id;
    var ss=famStars(id);
    if(ss[0]===3&&ss[1]===3&&ss[2]===3){
      var cand=pickStarCand(picked);
      if(cand){
        graduated.push(f.name);
        picked.push(cand.id);
        changed=true;
        return cand.id;
      }
    }
    return id;
  });
  if(changed){
    PROG.starSlots=newSlots; saveProg();
    toast('🎉 '+graduated.join('、')+' 毕业啦！新明星字族登场！');
    if(window.ANIM) ANIM.burst();
    if(window.AUDIO&&SOUND) AUDIO.levelup();
  }
  return newSlots;
}

/* ================= 描红画布 ================= */
function openTraceModal(ch){
  var mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML='<div class="modal trace-modal">'+
    '<button class="modal-x">✕</button>'+
    '<div class="sage-title" style="margin-bottom:4px">✍️ 描一描「'+ch+'」</div>'+
    '<p style="color:var(--muted);font-size:13px;margin-bottom:8px">用手指或鼠标，照着米字格里的灰字描一遍</p>'+
    '<canvas id="traceCv" width="300" height="300"></canvas>'+
    '<div class="m-actions"><button class="btn secondary small" id="trClear">🧽 重来</button>'+
    '<button class="btn big" id="trDone">✅ 描好了</button></div></div>';
  document.body.appendChild(mask);
  var cv=$('#traceCv',mask), ctx=cv.getContext('2d');
  function drawTemplate(){
    ctx.clearRect(0,0,300,300);
    ctx.strokeStyle='#D8CBA8'; ctx.lineWidth=1.5;
    ctx.strokeRect(8,8,284,284);
    ctx.save();
    ctx.setLineDash([6,6]); ctx.strokeStyle='#E5DCC2';
    ctx.beginPath();
    ctx.moveTo(150,8); ctx.lineTo(150,292);
    ctx.moveTo(8,150); ctx.lineTo(292,150);
    ctx.moveTo(8,8); ctx.lineTo(292,292);
    ctx.moveTo(292,8); ctx.lineTo(8,292);
    ctx.stroke(); ctx.restore();
    ctx.font='220px "Kaiti SC","KaiTi","STKaiti","楷体",serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(91,74,47,0.20)';
    ctx.fillText(ch,150,168);
  }
  drawTemplate();
  var drawing=false;
  function pos(e){
    var r=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches.length)?e.touches[0]:e;
    return {x:(t.clientX-r.left)*(300/r.width), y:(t.clientY-r.top)*(300/r.height)};
  }
  function start(e){ drawing=true; var p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); if(e.cancelable) e.preventDefault(); }
  function move(e){
    if(!drawing) return;
    var p=pos(e);
    ctx.lineWidth=10; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#C94A2C';
    ctx.lineTo(p.x,p.y); ctx.stroke();
    if(e.cancelable) e.preventDefault();
  }
  function end(){ drawing=false; }
  cv.addEventListener('mousedown',start);
  cv.addEventListener('mousemove',move);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
  window.addEventListener('mouseup',end);
  function close(){ window.removeEventListener('mouseup',end); mask.remove(); }
  $('#trClear',mask).addEventListener('click',function(){ drawTemplate(); if(window.AUDIO) AUDIO.tap(); });
  $('#trDone',mask).addEventListener('click',function(){ close(); praise(); if(window.META) META.addCoins(2); });
  $('.modal-x',mask).addEventListener('click',close);
  mask.addEventListener('click',function(e){ if(e.target===mask) close(); });
}

/* ================= 游戏引擎 ================= */
/* 满星规则：短关卡（<8题）须零失误；长关卡允许错 1 题仍得满星，减少挫败感 */
function starsFor(mistakes,total){
  if(mistakes===0) return 3;
  if(total&&total>=8&&mistakes===1) return 3;
  if(mistakes<=2) return 2;
  return 1;
}
function wrongRecord(type,q,a,ex){
  return {type:type,q:q,a:a,ex:ex};
}
function renderResult(opts){
  clearTimers();
  var stars=starsFor(opts.mistakes,opts.total);
  var ti=stars===3?['满星通关！你是字族大师！','🎉 一个错都没有，字根彻底学透了！']:
         stars===2?['很不错！再接再厉！','💪 差一点点，回去看看字卡再挑战！']:
                    ['继续加油，多想想字根！','📖 先回字族页复习一下故事和歌诀吧！'];
  if(opts.save) opts.save(stars);
  if(window.META) META.onGameEnd(stars);
  var wrongsHtml='';
  if(opts.wrongs.length){
    wrongsHtml='<div class="res-wrongs"><h4>📒 错题回顾（'+opts.wrongs.length+'题）</h4><ul>'+
      opts.wrongs.map(function(w){
        var body='';
        if(w.type==='build') body='题目：'+w.q+'<br>正确答案：<span class="ans">'+w.a+'</span>';
        else if(w.type==='fill') body='句子：'+w.q.replace('＿','<span class="ans">'+w.a+'</span>')+'<br><span class="ans">'+w.a+'</span>　'+w.ex;
        else body='<span class="ans">'+w.q+'</span><br>'+w.ex;
        return '<li>'+body+'</li>';
      }).join('')+
      '</ul></div>';
  }
  var btns='';
  if(opts.nextBtn) btns+='<button class="btn big" id="resNext">'+opts.nextBtn+'</button>';
  if(opts.famId) btns+='<button class="btn secondary" id="resFam">🏠 回到字族</button>';
  btns+='<button class="btn ghost" id="resRetry">🔄 再玩一次</button>';
  app.innerHTML=
    '<div class="result">'+
      '<div class="res-stars" id="resStars">'+starsHtml(stars)+'</div>'+
      '<div class="res-title">'+ti[0]+'</div>'+
      '<div class="res-sub">'+ti[1]+'　（答对 '+(opts.total-opts.mistakes)+' / '+opts.total+' 题）</div>'+
      wrongsHtml+
      '<div class="res-btns">'+btns+'</div>'+
    '</div>';
  var starsEls=$all('#resStars .star');
  starsEls.forEach(function(el,i){ el.style.animationDelay=(0.25+i*0.35)+'s'; });
  if(stars===3) confetti();
  if(opts.retry) $('#resRetry').addEventListener('click',function(){ opts.retry(); });
  if(opts.nextBtn) $('#resNext').addEventListener('click',function(){ opts.next(); });
  if(opts.famId) $('#resFam').addEventListener('click',function(){ renderFamily(opts.famId); });
  updateHeader();
}

/* --- 组装汉字（单题） --- */
function buildOne(item,famId,onDone,headHtml){
  var area=$('#gameArea');
  area.innerHTML=headHtml;
  if(item.type==='zhishi'){
    area.innerHTML+=
      '<div class="gcard">'+
        '<p class="gq">👉 '+item.q+'</p>'+
        '<div class="zhishi-base">'+item.base+'</div>'+
        '<div class="zhishi-btns">'+
          '<button class="btn secondary" data-pos="top">⬆️ 加在上边</button>'+
          '<button class="btn secondary" data-pos="bottom">⬇️ 加在下边</button>'+
        '</div>'+
        '<div class="hint" id="zhHint"></div>'+
      '</div>';
    var mistakes=0,wrong=false;
    $all('.zhishi-btns button').forEach(function(b){
      b.addEventListener('click',function(){
        if(wrong) return;
        if(b.getAttribute('data-pos')===item.pos){
          wrong=true;
          var g=$('.gcard',area);
          g.querySelector('.zhishi-base').remove();
          g.querySelector('.zhishi-btns').remove();
          var r=document.createElement('div');
          r.className='zhishi-result';
          r.textContent=item.result;
          g.insertBefore(r,g.querySelector('#zhHint'));
          praise(); speak(item.result);
          later(function(){ onDone(mistakes,[]); },1500);
        }else{
          mistakes++;
          miss();
          wrong=true;
          b.classList.add('shake');
          var h=$('#zhHint',area);
          h.textContent='❌ 再想想：'+item.ex;
          later(function(){ wrong=false; b.classList.remove('shake'); },800);
        }
      });
    });
    return;
  }
  area.innerHTML+=
    '<div class="gcard">'+
      '<p class="gq">🧩 '+item.q+'</p>'+
      '<div class="targetline"><span class="target-label">拼出这个字：</span></div>'+
      '<div class="slots">'+item.ans.map(function(){return '<div class="slot"></div>';}).join('')+'</div>'+
      '<div class="pool">'+item.pool.map(function(c){return '<button class="chip">'+c+'</button>';}).join('')+'</div>'+
      '<div><span class="hint" id="bHint"></span></div>'+
    '</div>';
  var mistakes=0,wrongs=[],solved=false;
  var slots=$all('.slot',area), chips=$all('.chip',area);
  function chosenNow(){ return slots.map(function(s){return s.dataset.ch||'';}).filter(Boolean); }
  function check(){
    var got=chosenNow();
    var ok=got.slice().sort().join('')===item.ans.slice().sort().join('');
    if(ok){
      solved=true;
      var tl=$('.targetline',area);
      var el=document.createElement('span');
      el.className='assembled'; el.textContent=item.target;
      tl.appendChild(el);
      chips.forEach(function(c){ c.classList.add('used'); });
      praise(); speak(item.target);
      later(function(){ onDone(mistakes,wrongs); },1500);
    }else{
      mistakes++;
      miss();
      noteWrong(item.target);
      var mem=memOf(famId,item.target);
      var hintText=(mem&&mem.tip)?('❌ 再想想：'+mem.tip):'❌ 再想想：想想字义，选对部件！';
      $('#bHint',area).textContent=hintText;
      $('.slots',area).classList.add('shake');
      later(function(){
        $('.slots',area).classList.remove('shake');
        slots.forEach(function(s){ s.dataset.ch=''; s.textContent=''; s.classList.remove('filled'); });
        chips.forEach(function(c){ c.classList.remove('used'); });
      },750);
    }
  }
  chips.forEach(function(c){
    c.addEventListener('click',function(){
      if(solved||c.classList.contains('used')) return;
      var empty=slots.filter(function(s){return !s.dataset.ch;})[0];
      if(!empty) return;
      empty.dataset.ch=c.textContent;
      empty.textContent=c.textContent;
      empty.classList.add('filled');
      c.classList.add('used');
      if(chosenNow().length===item.ans.length) check();
    });
  });
  slots.forEach(function(s){
    s.addEventListener('click',function(){
      if(solved||!s.dataset.ch) return;
      var ch=s.dataset.ch;
      var chip=chips.filter(function(c){return c.textContent===ch&&c.classList.contains('used');})[0];
      if(chip) chip.classList.remove('used');
      s.dataset.ch=''; s.textContent=''; s.classList.remove('filled');
    });
  });
}

function startDetectiveFlow(famId,items){

  function next(){
    if(i>=items.length){
      renderResult({
        total:items.length,mistakes:mistakes,wrongs:wrongs,
        famId:famId,
        save:function(s){ setStars(famId,1,s); },
        nextBtn:'▶️ 下一关',
        next:function(){ renderGame(famId,2); },
        retry:function(){ renderGame(famId,1); }
      });

    }
    var head='<div class="gmeta"><span class="gnum">第 '+(i+1)+' / '+items.length+' 题</span><span>出错 '+mistakes+' 次</span></div>';
    detectiveOne(items[i],famId,function(m,w){
      mistakes+=m;
      wrongs=wrongs.concat(w);
      i++; next();
    },head);
  }
  next();
}

function startMatchFlow(famId,pairs){
  var area=gameShell(famId,2,'');
  var mistakes=0,wrongs=[],doneCount=0;
  var selCh=null;
  var ms=pairs.map(function(p){return p[1];});
  shuffle(ms);
  area.innerHTML=
    '<div class="gmeta"><span>把字和意思连起来</span><span id="mMiss">出错 0 次</span></div>'+
    '<div class="gcard matchwrap">'+
      '<div class="mcol chars" id="colL">'+pairs.map(function(p){return '<button data-ch="'+p[0]+'">'+p[0]+'</button>';}).join('')+'</div>'+
      '<div class="mcol" id="colR">'+ms.map(function(m){return '<button data-m="'+m+'">'+m+'</button>';}).join('')+'</div>'+
    '</div>';
  var leftBtns=$all('#colL button',area), rightBtns=$all('#colR button',area);
  leftBtns.forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('locked')) return;
      leftBtns.forEach(function(x){x.classList.remove('sel');});
      b.classList.add('sel');
      selCh=b.getAttribute('data-ch');
    });
  });
  rightBtns.forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('locked')||!selCh) return;
      var correctM=null;
      for(var i=0;i<pairs.length;i++) if(pairs[i][0]===selCh) correctM=pairs[i][1];
      if(b.getAttribute('data-m')===correctM){
        var lb=leftBtns.filter(function(x){return x.getAttribute('data-ch')===selCh;})[0];
        lb.classList.remove('sel'); lb.classList.add('locked');
        b.classList.add('locked');
        selCh=null; doneCount++;
        speak(lb.getAttribute('data-ch'));
        if(doneCount===pairs.length){
          later(function(){
            renderResult({
              total:pairs.length,mistakes:mistakes,wrongs:wrongs,
              famId:famId,
              save:function(s){ setStars(famId,2,s); },
              retry:function(){ renderGame(famId,2); }
            });
          },900);
        }
      }else{
        mistakes++;
        miss();
        noteWrong(selCh);
        var mem=memOf(famId,selCh);
        wrongs.push(wrongRecord('match',selCh+' 应该和「'+correctM+'」配对','🔎 '+(mem?mem.tip:''),''));
        b.classList.add('wrongflash');
        b.classList.add('shake');
        $('#mMiss',area).textContent='出错 '+mistakes+' 次';
        later(function(){ b.classList.remove('wrongflash'); b.classList.remove('shake'); },700);
      }
    });
  });
}
function renderGame(famId,gi){
  var f=FAMMAP[famId];
  if(gi===0){ gameShell(famId,0,''); startBuildFlow(famId,f.build); }
  else if(gi===1){ gameShell(famId,1,''); if(f.auto) startDetectiveFlow(famId,f.det); else startFillFlow(famId,f.fill); }
  else { startMatchFlow(famId,f.match); }
}

/* ================= 终极挑战 ================= */
function runReview(){
  clearTimers();
  var items=[];
  FAM.slice(0,4).forEach(function(f){
    items.push({t:'build',it:f.build[0]});
    items.push({t:'fill',it:f.fill[0]});
    items.push({t:'fill',it:f.fill[4]});
  });
  shuffle(items);
  var i=0,mistakes=0,wrongs=[];
  app.innerHTML=
    '<div class="ghead">'+
      '<button class="btn ghost small" id="gBack">← 首页</button>'+
      '<div class="gtitle">🏆 终极挑战 · 四大字族混合</div>'+
    '</div>'+
    '<div id="gameArea"></div>';
  $('#gBack').addEventListener('click',renderHome);
  function next(){
    if(i>=items.length){
      var stars=starsFor(mistakes,items.length);
      if(PROG.review===null||stars>PROG.review){ PROG.review=stars; saveProg(); }
      renderResult({
        total:items.length,mistakes:mistakes,wrongs:wrongs,
        save:function(){},
        retry:runReview
      });
      return;
    }
    var item=items[i]; i++;
    var head='<div class="gmeta"><span class="gnum">第 '+i+' / '+items.length+' 题</span><span>出错 '+mistakes+' 次</span></div>';
    var cb=function(m,w){
      mistakes+=m;
      wrongs=wrongs.concat(w);
      next();
    };
    if(item.t==='build') buildOne(item.it,familyOfTarget(item.it.target),cb,head);
    else fillOne(item.it,familyOfTarget(item.it.a),cb,head);
  }
  function familyOfTarget(ch){
    for(var k=0;k<FAM.length;k++){
      if(FAM[k].members.some(function(m){return m.ch===ch;})) return FAM[k].id;
    }

  return s;
}
function gradePool(){
  if(GCH.g==='all') return gradePoolAll();
  return (window.GRADE_CHARS&&window.GRADE_CHARS[GCH.g])||[];
}
function charWeight(ch){
  var p=PROG.perf&&PROG.perf[ch];
  if(!p) return 1;
  var w=1;
  if(p.w>0) w+=2*Math.min(p.w,3);
  if(p.r>=3 && p.w===0) w=0.35;
  else if(p.r>p.w && p.r>=2) w=0.7;
  return w;
}
function charGlossOf(ch){
  var f=famOfChar(ch);
  if(f){
    if(f.root===ch) return f.story.meaning;
    var m=memOf(f.id,ch);
    if(m && m.m) return m.m;
  }
  return '';
}
function weightedPick(pool,n){
  var arr=pool.slice();
  var out=[];
  while(out.length<n && arr.length){
    var total=0,i;
    for(i=0;i<arr.length;i++) total+=charWeight(arr[i]);
    var r=Math.random()*total;
    var acc=0,picked=-1;
    for(i=0;i<arr.length;i++){ acc+=charWeight(arr[i]); if(r<acc){ picked=i; break; } }
    if(picked<0) picked=arr.length-1;
    out.push(arr[picked]);
    arr.splice(picked,1);
  }
  return out;
}

/* 干扰项设计：优先同字族成员（形近/音近，最有辨析价值），其次同偏旁字，最后随机补满 */
function distractorsFor(ch,pool,n){
  var out=[];
  var f=famOfChar(ch);
  if(f){
    f.members.forEach(function(m){ if(m.ch!==ch&&out.indexOf(m.ch)<0&&pool.indexOf(m.ch)>=0) out.push(m.ch); });
    if(f.root!==ch&&out.indexOf(f.root)<0&&pool.indexOf(f.root)>=0) out.push(f.root);
  }
  var m0=f?memOf(f.id,ch):null;
  if(m0&&m0.parts&&m0.parts.length){
    var pc=m0.parts[0].c;
    for(var i=0;i<FAM.length&&out.length<n*3;i++){
      var mm=FAM[i].members;
      for(var j=0;j<mm.length;j++){
        if(mm[j].ch===ch||out.indexOf(mm[j].ch)>=0||pool.indexOf(mm[j].ch)<0) continue;
        if(mm[j].parts&&mm[j].parts.length&&mm[j].parts[0].c===pc) out.push(mm[j].ch);
      }
    }
  }
  shuffle(out);
  var others=pool.slice(); shuffle(others);
  for(var k=0;k<others.length&&out.length<n;k++){ if(others[k]!==ch&&out.indexOf(others[k])<0) out.push(others[k]); }
  return out.slice(0,n);
}
function startGradeFlow(){
  /* 只考字族库里有释义的字，避免出现"哪个字表示「这个字」？"的空题干 */
  var pool=gradePool().filter(function(ch){ return !!charGlossOf(ch); });
  if(pool.length<4){ toast('这个年级的字还在字族库建设中，先换个年级试试'); return; }
  var picked=weightedPick(pool,Math.min(10,pool.length));
  var items=picked.map(function(ch){
    var gl=charGlossOf(ch);
    var opts=[ch].concat(distractorsFor(ch,pool,2));
    shuffle(opts);
    return {s:'哪个字表示「'+gl+'」？',opts:opts,a:ch,ex:'「'+ch+'」：'+gl};
  });
  app.innerHTML=
    '<div class="ghead">'+
      '<button class="btn ghost small" id="gBack">← 等级</button>'+
      '<div class="gtitle">🎓 自检中 · '+(GCH.g==='all'?'全部年级':('年级 '+GCH.g))+'</div>'+
    '</div>'+
    '<div id="gameArea"></div>';
  $('#gBack').addEventListener('click',function(){ renderGrade(); });
  var i=0,right=0;
  function next(){
    if(i>=items.length){
      var stars=starsFor(items.length-right,items.length);
      if(!PROG.gradeBest[GCH.g]||stars>PROG.gradeBest[GCH.g]){ PROG.gradeBest[GCH.g]=stars; saveProg(); }
      var weak=[];
      items.forEach(function(it){
        var p=PROG.perf[it.a]||{};
        if((p.w||0)>(p.r||0)) weak.push(it.a);
      });
      var weakHtml=weak.length?('<div class="res-wrongs"><h4>📌 需要加强的 '+weak.length+' 个字（点击去学）</h4><div class="weakchips">'+weak.slice(0,10).map(function(ch){return '<button class="wordchip" data-wch="'+ch+'">'+ch+'</button>';}).join('')+'</div></div>'):'';
      app.innerHTML=
        '<div class="result">'+
          '<div class="res-stars" id="resStars">'+starsHtml(stars)+'</div>'+
          '<div class="res-title">'+(right===items.length?'全对！这个等级已经难不倒你！':'答对 '+right+' / '+items.length+' 题')+'</div>'+
          '<div class="res-sub">'+(right===items.length?'可以挑战更高年级啦！':'错过的字会自动"加班"，下次优先考你')+'</div>'+
          weakHtml+
          '<div class="res-btns">'+
            '<button class="btn big" id="resAgain">🔄 再来 10 题</button>'+
            '<button class="btn secondary" id="resBack">← 选择等级</button>'+
          '</div>'+
        '</div>';
      var starsEls=$all('#resStars .star');
      starsEls.forEach(function(el,i2){ el.style.animationDelay=(0.25+i2*0.35)+'s'; });
      if(stars===3) confetti();
      if(window.META){ META.onGameEnd(stars); META.trackGradeDone(); }

/* ================= 错题本（持久化） ================= */
function getWrongBook(){
  if(!PROG.wrongBook) PROG.wrongBook={};
  return PROG.wrongBook;
}
function noteWrong(ch){
  if(!ch) return;
  var wb=getWrongBook();
  var e=wb[ch]||{c:0,last:0};
  e.c++; e.last=Date.now();
  wb[ch]=e; saveProg();
}
function noteRight(ch){
  var wb=getWrongBook();
  if(wb[ch]){ wb[ch].c-=2; if(wb[ch].c<=0) delete wb[ch]; saveProg(); }
}
function wrongBookList(){
  var wb=getWrongBook();
  return Object.keys(wb).sort(function(a,b){ return wb[b].c-wb[a].c; });
}

/* ================= 听写模式 ================= */
function dictWordOf(ch){
  var f=famOfChar(ch);
  if(!f) return '';
  if(f.root===ch){ var m0=f.members[0]; return m0&&m0.w?m0.w.split(' · ')[0]:''; }
  var m=memOf(f.id,ch);
  return m&&m.w?m.w.split(' · ')[0]:'';
}
function startDictFlow(){
  clearTimers();
  var pool=gradePool().filter(function(ch){ return !!charGlossOf(ch); });
  if(pool.length<4){ toast('这个年级的字还在字族库建设中，先换个年级试试'); return; }
  var picked=weightedPick(pool,Math.min(10,pool.length));
  var i=0,right=0,wrongs=[];
  app.innerHTML=
    '<div class="ghead">'+
      '<button class="btn ghost small" id="gBack">← 等级</button>'+
      '<div class="gtitle">📝 听写中 · '+(GCH.g==='all'?'全部年级':('年级 '+GCH.g))+'</div>'+
    '</div>'+
    '<div id="gameArea"></div>';
  $('#gBack').addEventListener('click',function(){ renderGrade(); });
  function next(){
    if(i>=picked.length){
      var stars=starsFor(picked.length-right,picked.length);
      if(window.META){ META.onGameEnd(stars); META.trackGradeDone(); }
      var wrongHtml=wrongs.length?('<div class="res-wrongs"><h4>📌 写错的 '+wrongs.length+' 个字（已收入错题本，点击去学）</h4><div class="weakchips">'+wrongs.map(function(ch){return '<button class="wordchip" data-wch="'+ch+'">'+ch+'</button>';}).join('')+'</div></div>'):'';
      app.innerHTML=
        '<div class="result">'+
          '<div class="res-stars" id="resStars">'+starsHtml(stars)+'</div>'+
          '<div class="res-title">'+(right===picked.length?'全对！听写小能手！':'听写完成：写对 '+right+' / '+picked.length)+'</div>'+
          '<div class="res-sub">'+(right===picked.length?'可以挑战更高年级啦！':'写错的字已自动加入错题本，记得去复习')+'</div>'+
          wrongHtml+
          '<div class="res-btns">'+
            '<button class="btn big" id="dAgain">🔄 再听写 10 词</button>'+
            '<button class="btn secondary" id="dBook">📒 去错题本</button>'+
            '<button class="btn ghost" id="dBack">← 选择等级</button>'+
          '</div>'+
        '</div>';
      var starsEls=$all('#resStars .star');
      starsEls.forEach(function(el,i2){ el.style.animationDelay=(0.25+i2*0.35)+'s'; });
      if(stars===3) confetti();
      $('#dAgain').addEventListener('click',startDictFlow);
      $('#dBook').addEventListener('click',renderWrongBook);
      $('#dBack').addEventListener('click',renderGrade);
      $all('.weakchips .wordchip').forEach(function(el){
        el.addEventListener('click',function(){
          var ch=el.getAttribute('data-wch');
          var f=famOfChar(ch);
          if(f) openMemberModal(f.id,ch);
        });
      });
      updateHeader();
      return;
    }
    var ch=picked[i];
    var w=dictWordOf(ch);
    var head='<div class="gmeta"><span class="gnum">第 '+(i+1)+' / '+picked.length+' 词</span><span>已写对 '+right+'</span></div>';
    var area=$('#gameArea');
    area.innerHTML=head+
      '<div class="gcard dictcard">'+
        '<p class="gq">📝 听仔细，把字写在纸上（不会就想想它的字根）</p>'+
        '<div class="dict-big">？</div>'+
        '<div class="rbtns"><button class="btn" id="dHear">🔊 再听一遍</button>'+
        '<button class="btn big" id="dShow">👀 写好了，对答案</button></div>'+
        '<div id="dAnswer"></div>'+
      '</div>';
    function speakIt(){ speak(w?('请听写，'+w+'。'+w+'的'+ch+'。'):('请听写，'+ch+'。'+charGlossOf(ch))); }
    later(speakIt,400);
    $('#dHear').addEventListener('click',speakIt);
    $('#dShow').addEventListener('click',function(){
      var ans=$('#dAnswer');
      if(ans.dataset.open) return;
      ans.dataset.open='1';
      ans.innerHTML=
        '<div class="dict-reveal"><span class="dict-char">'+ch+'</span>'+
        '<div class="dict-gl">'+(w?('词语：'+w+' · '):'')+charGlossOf(ch)+'</div></div>'+
        '<p class="gq" style="margin-top:10px">写对了吗？诚实点哦</p>'+
        '<div class="rbtns"><button class="btn big" id="dRight">✅ 写对了</button>'+
        '<button class="btn secondary" id="dWrong">❌ 写错了</button></div>';
      speak(ch+'，'+charGlossOf(ch));
      $('#dRight').addEventListener('click',function(){
        right++;
        var p=PROG.perf[ch]||{r:0,w:0}; p.r=(p.r||0)+1; PROG.perf[ch]=p;
        noteRight(ch);
        praise(); saveProg();
        i++; next();
      });
      $('#dWrong').addEventListener('click',function(){
        var p=PROG.perf[ch]||{r:0,w:0}; p.w=(p.w||0)+1; PROG.perf[ch]=p;
        noteWrong(ch); saveProg();
        wrongs.push(ch);
        miss();
        if(window.AUDIO) AUDIO.wrong();
        i++; next();
      });
    });
  }
  next();
  updateHeader();
}

function startWrongReview(){
  clearTimers();
  var list=wrongBookList().filter(function(ch){ return !!charGlossOf(ch); }).slice(0,10);
  if(!list.length){ toast('错题本里的字暂时没有释义题，直接点字卡复习吧'); return; }
  var pool=gradePoolAll().filter(function(ch){ return !!charGlossOf(ch); });
  var items=list.map(function(ch){
    var gl=charGlossOf(ch);
    var opts=[ch].concat(distractorsFor(ch,pool.length?pool:list,2));
    shuffle(opts);
    return {s:'哪个字表示「'+gl+'」？',opts:opts,a:ch,ex:'「'+ch+'」：'+gl};
  });
  var i=0,right=0;
  app.innerHTML=
    '<div class="ghead"><button class="btn ghost small" id="gBack">← 错题本</button>'+
    '<div class="gtitle">📒 错题复习 · '+items.length+' 题</div></div><div id="gameArea"></div>';
  $('#gBack').addEventListener('click',renderWrongBook);
  function next(){
    if(i>=items.length){
      var stars=starsFor(items.length-right,items.length);
      if(window.META) META.onGameEnd(stars);
      app.innerHTML=
        '<div class="result">'+
          '<div class="res-stars" id="resStars">'+starsHtml(stars)+'</div>'+
          '<div class="res-title">'+(right===items.length?'全部攻克！错题毕业啦！':'复习完成：答对 '+right+' / '+items.length)+'</div>'+
          '<div class="res-sub">答对的字已经从错题本里"毕业"，还错的会继续留下来</div>'+
          '<div class="res-btns">'+
            '<button class="btn big" id="wrAgain">🔄 再复习一轮</button>'+
            '<button class="btn secondary" id="wrBack">📒 回错题本</button>'+
          '</div>'+
        '</div>';
      var starsEls=$all('#resStars .star');
      starsEls.forEach(function(el,i2){ el.style.animationDelay=(0.25+i2*0.35)+'s'; });
      if(stars===3) confetti();
      $('#wrAgain').addEventListener('click',startWrongReview);
      $('#wrBack').addEventListener('click',renderWrongBook);
      updateHeader();
      return;
    }
    var head='<div class="gmeta"><span class="gnum">第 '+(i+1)+' / '+items.length+' 题</span><span>答对 '+right+'</span></div>';
    gradeOne(items[i],function(ok){
      if(ok){ right++; noteRight(items[i].a); }
      else noteWrong(items[i].a);
      i++; next();
    },head);
  }
  next();
  updateHeader();
}

function getProfiles(){
  try{ return JSON.parse(localStorage.getItem('zigen_profiles')||'[]'); }catch(e){ return []; }
}
function saveProfiles(list){ try{ localStorage.setItem('zigen_profiles',JSON.stringify(list)); }catch(e){} }
function currentProfileId(){ try{ return localStorage.getItem('zigen_current_profile')||''; }catch(e){ return ''; } }
function currentProfileName(){
  var id=currentProfileId();
  if(!id) return '默认';
  var ps=getProfiles();
  for(var i=0;i<ps.length;i++) if(ps[i].id===id) return ps[i].name;
  return '默认';
}
/* 家长锁：一道乘法题，防止孩子误进 */
function parentGate(cb){
  var a=3+Math.floor(Math.random()*6), b=4+Math.floor(Math.random()*5);
  var ans=a*b;
  var opts=[ans];
  while(opts.length<3){
    var d=ans+[-3,-2,-1,1,2,3][Math.floor(Math.random()*6)];
    if(d>0&&opts.indexOf(d)<0) opts.push(d);
  }
  shuffle(opts);
  var mask=document.createElement('div');
  mask.className='modal-mask';
  mask.innerHTML='<div class="modal gate-modal">'+
    '<div class="sage-title" style="margin-bottom:6px">🛡️ 家长验证</div>'+
    '<p style="color:var(--muted);font-size:14px;margin-bottom:12px">这里是家长/老师专区，请回答：</p>'+
    '<div class="gate-q">'+a+' × '+b+' = ?</div>'+
    '<div class="opts">'+opts.map(function(o){return '<button data-v="'+o+'">'+o+'</button>';}).join('')+'</div>'+
    '<div style="margin-top:10px"><button class="btn ghost small" id="gateCancel">取消</button></div>'+
    '</div>';
  document.body.appendChild(mask);
  $all('.opts button',mask).forEach(function(el){
    el.addEventListener('click',function(){
      if(+el.getAttribute('data-v')===ans){ mask.remove(); cb(); }
      else{
        el.classList.add('wrong','shake'); el.disabled=true;
        if(window.AUDIO) AUDIO.wrong();
        later(function(){ mask.remove(); },800);
      }
    });
  });
  $('#gateCancel',mask).addEventListener('click',function(){ mask.remove(); });
  mask.addEventListener('click',function(e){ if(e.target===mask) mask.remove(); });
}
